name: fraud-detection-demo

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic transactions --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic fraud-alerts --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic late-transactions --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic generator-control --partitions 1 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic generator-status --partitions 1 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list

  flink-state-init:
    image: fraud-detection-flink:local
    user: "0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /flink-data/checkpoints /flink-data/savepoints && chown -R flink:flink /flink-data
    volumes:
      - flink-state:/flink-data

  jobmanager:
    build:
      context: ./flink-job
    image: fraud-detection-flink:local
    ports:
      - "8081:8081"
    command: standalone-job --job-classname com.example.fraud.FraudDetectionJob
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TRANSACTIONS_TOPIC: transactions
      ALERTS_TOPIC: fraud-alerts
      LATE_TRANSACTIONS_TOPIC: late-transactions
      ALERTS_TRANSACTIONAL_ID_PREFIX: fraud-alerts-v1-
      LATE_TRANSACTIONAL_ID_PREFIX: late-transactions-v1-
      HIGH_AMOUNT_THRESHOLD: ${HIGH_AMOUNT_THRESHOLD:-100000000}
      RAPID_TRANSACTION_COUNT: ${RAPID_TRANSACTION_COUNT:-5}
      RAPID_WINDOW_SECONDS: ${RAPID_WINDOW_SECONDS:-10}
      COUNTRY_CHANGE_WINDOW_SECONDS: ${COUNTRY_CHANGE_WINDOW_SECONDS:-120}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2
        state.checkpoints.dir: file:///flink-data/checkpoints
        state.savepoints.dir: file:///flink-data/savepoints
        execution.checkpointing.interval: 10000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    volumes:
      - flink-state:/flink-data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      flink-state-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  taskmanager:
    image: fraud-detection-flink:local
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
    volumes:
      - flink-state:/flink-data
    depends_on:
      jobmanager:
        condition: service_started
    restart: unless-stopped

  generator:
    build:
      context: ./generator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TRANSACTIONS_TOPIC: transactions
      GENERATOR_CONTROL_TOPIC: generator-control
      GENERATOR_STATUS_TOPIC: generator-status
      TRANSACTIONS_PER_SECOND: ${TRANSACTIONS_PER_SECOND:-4}
      FRAUD_INTERVAL_SECONDS: ${FRAUD_INTERVAL_SECONDS:-8}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TRANSACTIONS_TOPIC: transactions
      ALERTS_TOPIC: fraud-alerts
      LATE_TRANSACTIONS_TOPIC: late-transactions
      GENERATOR_CONTROL_TOPIC: generator-control
      GENERATOR_STATUS_TOPIC: generator-status
      CASE_DB_PATH: /data/cases.db
    volumes:
      - dashboard-data:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  kafka-data:
  flink-state:
  dashboard-data:
